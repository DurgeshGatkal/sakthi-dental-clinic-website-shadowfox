name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Section 17, steps 1 to 4: install, lint, typecheck, test, build.
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # The client build prerenders every route, so it needs a live API and a
    # seeded database. The service container provides both for this job.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/sakthi_ci
      IP_HASH_SALT: ci-only-salt
      MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Seed content
        run: npm run seed

      - name: Start API
        run: |
          nohup npm run start -w @sakthi/server > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/v1/health > /dev/null; then
              echo "API is up after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1

      - name: Build
        run: npm run build --if-present

  # Section 17, steps 5 and 6 are enabled on Day 8, once Playwright and
  # Lighthouse CI are wired up. They stay commented so the skeleton never
  # reports a false green or a red build before the tooling exists.

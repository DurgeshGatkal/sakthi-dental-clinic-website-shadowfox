name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Section 17, steps 1 to 4: install, lint, typecheck, test, build.
  quality:
    name: Lint, typecheck, test, build
    # Pinned rather than ubuntu-latest: the runner image migration to Ubuntu 26
    # is in progress and Playwright's --with-deps is only guaranteed on 24.04.
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      IP_HASH_SALT: ci-only-salt
      MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      # Every client route prerenders, so the build needs a seeded API. Rather
      # than depend on a Docker service container, this reuses the same entry
      # point Vercel runs: it starts an in-memory MongoDB, seeds it, boots the
      # API, builds, and tears everything down.
      - name: Build
        run: node scripts/vercel-build.mjs

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build
          retention-days: 1

  e2e:
    name: Playwright + axe
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: client/build

      # scripts/e2e-env.mjs starts its own in-memory MongoDB, seeded API and
      # static server, so this job needs no services either.
      - name: End-to-end + accessibility
        run: npm run test:e2e

  # Lighthouse is run locally against the prerendered build (see README);
  # keeping it out of CI avoids flaky scores on shared runners.
